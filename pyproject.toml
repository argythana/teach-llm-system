[project]
name = "teach-llm-system"
version = "0.1.0"
description = "A short course on building a local LLM system with RAG and evaluation: Ollama, LangChain, Chroma, MLflow."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "huggingface-hub>=1.31.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.3",
    "langchain>=1.4.0",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.6.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.2",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "matplotlib>=3.11.2",
    "mlflow>=3.16.0",
    "numpy>=2.5.3",
    "ollama>=0.6.2",
    "openai>=3.13.0",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "tokenizers>=0.23.2",
    "transformers>=5.17.0",
]

[dependency-groups]
dev = [
    "mdformat>=1.0.0",
    "mdformat-gfm>=1.0.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
    "prek>=0.5.3",
    "ruff>=0.16.7",
]
dspy = [
    "dspy>=3.3.1",
]
pgvector = [
    "langchain-postgres>=0.0.17",
    "psycopg[binary]>=3.3.5",
]
transformers-run = [
    "torch>=2.14.0",
]

[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_course"]

[tool.ruff]
line-length = 88
# corpus/ is generated from uoa_py_course by tools/export_corpus.py; keep its code as-is.
extend-exclude = ["corpus"]
# ruff lints the notebooks too (*.ipynb are included by default);
# the target Python version is inferred from requires-python.

[tool.ruff.lint]
# pycodestyle errors that do not clash with the formatter (E4, E7, E9) and pyflakes (F).
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# A teaching notebook may import a module next to the code that teaches it.
"*.ipynb" = ["E402"]
# Exercise notebooks import everything a student may need before the "# Your code here" cells.
"**/lec_*_exercises.ipynb" = ["F401"]
